[project]
name = "carrier-onboarding-kb"
version = "0.1.0"
description = "Cited, policy-bound knowledge service for Carrier Hub"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.10",
  "openai>=1.40",
  "google-api-python-client>=2.140",
  "google-auth>=2.35",
  "slack-sdk>=3.33",
  "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carrier_kb"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
